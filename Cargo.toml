[workspace]
members = [
    "crates/xlang-core",
    "apps/xlang-cli",
    "apps/xlang-studio/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "UNLICENSED"
authors = ["Wizard Productions AI Studio"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
