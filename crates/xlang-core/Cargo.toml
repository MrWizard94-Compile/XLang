[package]
name = "aether-core"
version = "0.37.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Aether parser, bytecode compiler, verifier, and virtual machine."

[dependencies]
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "std"] }
libloading = "0.8"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
# Built so M21 tests can grant an explicit path to a real cdylib.
aether-ffi-pilot = { path = "../aether-ffi-pilot" }

[lints]
workspace = true
