[package]
name = "aether-cli"
version = "0.19.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line compiler and virtual machine for Aether."
autobins = false

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether-core = { path = "../../crates/xlang-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
